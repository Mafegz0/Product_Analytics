project:
  name: "Product Analytics - Análisis de Mercado SNIES"
  methodology: "ASUM-DM"
  phase: "02_Data_Understanding"
  artifact: "data_quality_rules"
  owner: "Analytics"
  description: "Reglas de calidad aplicables al histórico SNIES, sus programas académicos, instituciones de educación superior y dimensiones derivadas para el modelo de análisis de mercado."

quality_dimensions:
  - Completitud
  - Validez
  - Consistencia
  - Integridad referencial
  - Unicidad
  - Exactitud

severity_definition:
  Alta: "Afecta la integridad del histórico, la identificación de instituciones o la homologación de programas."
  Media: "Afecta análisis, categorización o comparabilidad entre años."
  Baja: "Afecta trazabilidad, presentación o enriquecimiento."

SNIES2020:
  source_name: "Historico_SNIES_2020"
  domain: "Mercado Educación Superior"
  type: "Histórico"
  grain: "1 fila por registro de programa académico e institución reportado en SNIES"
  expected_sheets:
    - "2020"
  notes: "Fuente histórica 2020. Presenta diferencias estructurales frente a los años posteriores y requiere homologación de nombres de columnas y creación de campos inexistentes en la fuente original."
  rules:
    - id: "SNIES2020_R001"
      column: "CÓDIGO DE LA INSTITUCIÓN"
      dimension: "Completitud"
      rule: "Código de institución obligatorio"
      expectation: "Todo registro válido debe contener un código de institución."
      severity: "Alta"

    - id: "SNIES2020_R002"
      column: "CÓDIGO DE LA INSTITUCIÓN"
      dimension: "Validez"
      rule: "Código de institución válido"
      expectation: "Debe ser convertible a un código numérico válido de institución."
      severity: "Alta"

    - id: "SNIES2020_R003"
      column: "AÑO"
      dimension: "Exactitud"
      rule: "Año histórico correcto"
      expectation: "Todos los registros de la hoja 2020 deben corresponder al año 2020."
      severity: "Alta"

    - id: "SNIES2020_R004"
      column: "AÑO_ORIGEN"
      dimension: "Exactitud"
      rule: "Año de origen correcto"
      expectation: "Debe ser igual a 2020 para todos los registros provenientes de la hoja 2020."
      severity: "Alta"

    - id: "SNIES2020_R005"
      column: "MODALIDAD"
      dimension: "Consistencia"
      rule: "Modalidad homologada"
      expectation: "La información histórica registrada como METODOLOGÍA debe ser comparable con el campo MODALIDAD utilizado en los años posteriores."
      severity: "Media"

    - id: "SNIES2020_R006"
      column: "MATRICULADOS PRIMER CURSO"
      dimension: "Consistencia"
      rule: "Variable de matriculados homologada"
      expectation: "La variable histórica PRIMER CURSO debe representar el mismo concepto que MATRICULADOS PRIMER CURSO utilizado en los años posteriores."
      severity: "Alta"

    - id: "SNIES2020_R007"
      column: "TIPO IES"
      dimension: "Consistencia"
      rule: "Tipo de institución homologado"
      expectation: "La variable histórica PRINCIPAL O SECCIONAL debe conservar equivalencia semántica con TIPO IES."
      severity: "Media"

    - id: "SNIES2020_R008"
      column: "IES ACREDITADA"
      dimension: "Completitud"
      rule: "Campo estructural disponible"
      expectation: "El esquema consolidado debe contener el campo IES ACREDITADA. Para 2020 puede permanecer nulo debido a que no existe en la fuente original."
      severity: "Baja"

    - id: "SNIES2020_R009"
      column: "PROGRAMA ACREDITADO"
      dimension: "Completitud"
      rule: "Campo estructural disponible"
      expectation: "El esquema consolidado debe contener el campo PROGRAMA ACREDITADO. Para 2020 puede permanecer nulo debido a que no existe en la fuente original."
      severity: "Baja"

