HISTORICO_SNIES:
  source_name: "HISTORICO_SNIES"
  domain: "Mercado Educación Superior"
  type: "Consolidado"
  grain: "1 fila por registro histórico de programa académico e institución reportado en SNIES"
  expected_sheets:
    - "2020"
    - "2021"
    - "2022"
    - "2023"
    - "2024"
    - "2025"
  notes: "Consolidado resultante de la homologación estructural y unión de las seis hojas históricas."
  rules:
    - id: "HIST_SNIES_R001"
      column: "AÑO_ORIGEN"
      dimension: "Completitud"
      rule: "Año de origen obligatorio"
      expectation: "Todos los registros consolidados deben conservar el año de la hoja de procedencia."
      severity: "Alta"

    - id: "HIST_SNIES_R002"
      column: "AÑO / AÑO_ORIGEN"
      dimension: "Consistencia"
      rule: "Coherencia temporal"
      expectation: "El valor de AÑO debe ser coherente con AÑO_ORIGEN para cada registro."
      severity: "Alta"

    - id: "HIST_SNIES_R003"
      column: "CÓDIGO DE LA INSTITUCIÓN"
      dimension: "Completitud"
      rule: "Institución identificable"
      expectation: "No deben permanecer en el consolidado registros sin un código de institución válido."
      severity: "Alta"

    - id: "HIST_SNIES_R004"
      column: "Esquema de columnas"
      dimension: "Consistencia"
      rule: "Estructura común entre años"
      expectation: "Los registros de 2020 a 2025 deben conservar una estructura homologada que permita su concatenación y comparación."
      severity: "Alta"
